<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <meta content="#7c3aed" name="theme-color" />
        <title>Bíblia Interlinear | Teologia Ninja</title>
        <script>
            (() => {
            const tema = localStorage.getItem('teologiaNinja_tema') || 'dark';
            const cor = localStorage.getItem('teologiaNinja_corDestaque') || 'purple';
            document.documentElement.setAttribute('data-bs-theme', tema);
            document.documentElement.setAttribute('data-accent', cor);
            })();
        </script>
        <link href="manifest.json" rel="manifest" />
        <link href="icons/icon-192.svg" rel="icon" type="image/svg+xml" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="css/estilo.css" rel="stylesheet" />
        <link href="css/biblia.css" rel="stylesheet" />
    </head>

    <body class="app-shell">
        <div id="layoutSistema"></div>
        <main class="app-main bible-main">
            <section class="module-container">
                <div class="toolbar-grid">
                    <div class="toolbar-field toolbar-livro">
                        <label for="livro">Livro</label>
                        <select class="form-select" id="livro"></select>
                    </div>
                    <div class="toolbar-field toolbar-capitulo">
                        <label for="capitulo">Capítulo</label>
                        <select class="form-select" id="capitulo">
                            <option value="1">1</option>
                        </select>
                    </div>
                    <div class="toolbar-field toolbar-versiculo">
                        <label for="versiculo">Versículo</label>
                        <select class="form-select" id="versiculo"></select>
                    </div>
                    <div class="toolbar-field toolbar-versao">
                        <label for="versao">Versão</label>
                        <select class="form-select" id="versao">
                            <option value="literal">Transliteração Literal</option>
                            <option disabled="">Almeida antiga — futura importação</option>
                            <option disabled="">ARA — exige autorização</option>
                            <option disabled="">NAA — exige autorização</option>
                            <option disabled="">NVI — exige autorização</option>
                        </select>
                    </div>
                    <div class="font-controls">
                        <label>Tamanho da fonte</label>
                        <div class="font-buttons">
                            <button class="btn btn-control" id="fonteMenos" type="button">A−</button>
                            <button class="btn btn-control" id="fonteAtual" type="button">100%</button>
                            <button class="btn btn-control" id="fonteMais" type="button">A+</button>
                        </div>
                    </div>
                </div>
                <div class="toolbar-bottom">
                    <div class="view-options"><span class="toolbar-section-title">Visualização</span>
                        <div class="view-buttons">
                            <button class="btn btn-view active" data-modo="cartoes" type="button">☷ Cartões</button>
                            <button class="btn btn-view" data-modo="grade" type="button">▦ Grade</button>
                            <button class="btn btn-view" data-modo="linhas" type="button">≡ Linhas</button>
                            <button class="btn btn-view" data-modo="tabela" type="button">▤ Tabela</button>
                        </div>
                        <label class="compact-table-option d-none" id="compactTableOption">
                            <input class="form-check-input" id="tabelaCompacta" type="checkbox" /><span>Tabela compacta</span></label>
                    </div>
                </div>
            </section>
            <div class="alert d-none mb-3" id="mensagemBiblia"></div>
            <section class="bible-layout" id="bibleLayout">
                <div class="bible-content-panel">
                    <div class="bible-header-row" id="bibleHeaderRow">
                        <span aria-hidden="true"></span>
                        <span>Original</span>
                        <span>Transliteração</span>
                        <span>Português</span>
                        <span aria-hidden="true"></span>
                    </div>
                    <div id="conteudoBiblico"></div>
                    <div class="pagination-demo" id="paginacaoVersiculos"></div>
                </div>
                <aside class="details-column" id="detailsColumn">
                    <section class="details-card lexical-details">
                        <div class="details-card-header">
                            <h2 id="tituloPassagem">Gênesis 1:1</h2></div>
                        <div class="details-content" id="detalhePalavra">
                            <div class="detail-original hebraico">בְּרֵאשִׁית</div>
                            <div class="detail-translit">Bereshit</div>
                            <div>No princípio</div>
                            <hr/>
                            <p><strong>Strong:</strong> <span class="accent-text">H7225</span></p>
                            <p><strong>Pronúncia:</strong> beh-resh-eet'</p>
                            <p><strong>Significado:</strong> No princípio, no começo</p>
                            <button class="btn btn-outline-accent w-100 mb-2">Ver detalhes</button>
                            <button class="btn btn-outline-accent w-100">Adicionar aos favoritos ♡</button>
                        </div>
                    </section>
                    <section class="details-card notes-details">
                        <h3>Notas pessoais</h3>
                        <textarea class="form-control note-area" placeholder="Adicione suas notas aqui..."></textarea>
                        <button class="btn btn-accent mt-3 ms-auto d-block">Salvar nota</button>
                    </section>
                </aside>
            </section>
            <footer class="app-footer">Teologia Ninja © 2026 — Todos os direitos reservados</footer>
        </main>
        <script>
            window.TEOLOGIA_NINJA_PAGINA = {
                "pagina": "biblia.html",
                "ativo": "biblia",
                "titulo": "Bíblia Interlinear",
                "subtitulo": "Texto original, transliteração e tradução",
                "secao": "BÍBLIA INTERLINEAR"
                };
        </script>
        <script src="js/layout.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/tema.js"></script>
        <script src="js/sistema.js"></script>
        <script src="js/dados-biblia.js"></script>
        <script src="js/biblia.js"></script>
        <script src="js/pwa.js"></script>
    </body>

</html>
