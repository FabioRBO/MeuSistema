<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#7c3aed" name="theme-color" />
    <title>Linha do Tempo Bíblica | Teologia Ninja</title>
    <script>
        (() => {
            const tema = localStorage.getItem('teologiaNinja_tema') || 'dark';
            const cor = localStorage.getItem('teologiaNinja_corDestaque') || 'purple';
            document.documentElement.setAttribute('data-bs-theme', tema);
            document.documentElement.setAttribute('data-accent', cor);
          })();
    </script>
    <link href="manifest.json" rel="manifest" />
    <link href="icons/icon-192.svg" rel="icon" type="image/svg+xml" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/estilo.css" rel="stylesheet" />
    <link href="css/linha_tempo.css" rel="stylesheet" />
    <link href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css" rel="stylesheet" title="timeline-styles" />
</head>

<body class="app-shell">
    <div id="layoutSistema"></div>
    <template id="paginaHeaderActions">
        <button class="btn-timeline-action" id="btn-toggle-midia" title="Mostrar ou ocultar mídia" type="button">Mídia</button>
        <button class="btn-icon" data-bs-target="#configuracoesPainel" data-bs-toggle="offcanvas" title="Configurações" type="button">⚙️</button>
    </template>

    <main class="timeline-main">
        <div aria-label="Linha do tempo bíblica" id="timeline-embed"></div>
    </main>

    <script>
        window.TEOLOGIA_NINJA_PAGINA = {
            "pagina": "linha_tempo.html",
            "ativo": "linha-tempo",
            "titulo": "Linha do Tempo Bíblica",
            "subtitulo": "Panorama histórico interativo",
            "secao": "LINHA DO TEMPO",
            "headerClass": "timeline-topbar"
          };
    </script>

    <script src="js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/sistema.js"></script>
    <script src="js/integracao-linha-tempo.js"></script>
    <script src="js/timeline.js"></script>

</body>

</html>
