<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Bíblia de Leitura | Teologia Ninja</title>
  <script>(()=>{const t=localStorage.getItem('teologiaNinja_tema')||'dark';const c=localStorage.getItem('teologiaNinja_corDestaque')||'purple';document.documentElement.setAttribute('data-bs-theme',t);document.documentElement.setAttribute('data-accent',c)})();</script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/biblia-leitura.css">
</head>
<body class="app-shell">
<div id="layoutSistema"></div>
<main class="app-main">
<section class="container-fluid py-3 py-lg-4">
  <section class="card biblia-toolbar mb-3"><div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-lg-3"><label class="form-label small text-secondary">Versão</label><select id="versaoBiblia" class="form-select"><option value="demo">Texto demonstrativo</option></select></div>
      <div class="col-7 col-lg-3"><label class="form-label small text-secondary">Livro</label><select id="livroBiblia" class="form-select"></select></div>
      <div class="col-5 col-lg-2"><label class="form-label small text-secondary">Capítulo</label><select id="capituloBiblia" class="form-select"></select></div>
      <div class="col-12 col-lg-4"><label class="form-label small text-secondary">Buscar</label><div class="input-group"><input id="buscaBiblia" class="form-control" type="search" placeholder="Buscar neste capítulo..."><button id="btnLimparBuscaBiblia" class="btn btn-outline-secondary" type="button">×</button></div></div>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <button id="btnCapituloAnterior" class="btn btn-outline-secondary btn-sm" type="button">← Anterior</button>
      <button id="btnCapituloProximo" class="btn btn-outline-secondary btn-sm" type="button">Próximo →</button>
      <button class="btn btn-outline-accent btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#painelFavoritos">♡ Favoritos</button>
      <button class="btn btn-outline-accent btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#painelAnotacoes">✎ Anotações</button>
    </div>
  </div></section>

  <section class="card biblia-reader"><div class="card-body p-3 p-lg-4">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
      <div><span class="eyebrow">BÍBLIA DE LEITURA</span><h1 id="tituloCapitulo" class="h2 mb-1">Carregando...</h1><p class="text-secondary mb-0">Leitura, marcações, anotações e favoritos</p></div>
      <div class="btn-group"><button id="btnDiminuirFonte" class="btn btn-outline-secondary btn-sm">A−</button><button id="btnAumentarFonte" class="btn btn-outline-secondary btn-sm">A+</button></div>
    </div>
    <div id="mensagemBiblia" class="alert d-none"></div>
    <div id="listaVersiculos" class="lista-versiculos"></div>
  </div></section>
  <footer class="app-footer mt-4">Teologia Ninja © 2026 — Bíblia de Leitura</footer>
</section>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="painelVersiculo">
  <div class="offcanvas-header border-bottom"><div><small class="text-secondary">Versículo selecionado</small><h2 id="tituloVersiculoPainel" class="offcanvas-title h5 mb-0"></h2></div><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body">
    <blockquote id="textoVersiculoPainel" class="versiculo-citacao"></blockquote>
    <div class="d-grid gap-2 mb-4">
      <button id="btnFavoritarVersiculo" class="btn btn-outline-accent">♡ Favoritar</button>
      <button id="btnAnotarVersiculo" class="btn btn-outline-accent">✎ Anotar</button>
      <button id="btnCopiarVersiculo" class="btn btn-outline-secondary">⧉ Copiar</button>
      <a id="btnAbrirInterlinear" class="btn btn-outline-secondary" href="biblia.html">אΩ Abrir Interlinear</a>
    </div>
    <h3 class="h6 text-uppercase text-secondary">Marcar com cor</h3>
    <div class="d-flex flex-wrap gap-2">
      <button class="marcador-cor marcador-amarelo" data-marcacao="amarelo"></button>
      <button class="marcador-cor marcador-verde" data-marcacao="verde"></button>
      <button class="marcador-cor marcador-azul" data-marcacao="azul"></button>
      <button class="marcador-cor marcador-rosa" data-marcacao="rosa"></button>
      <button class="btn btn-sm btn-outline-secondary" data-marcacao="">Remover</button>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="painelFavoritos"><div class="offcanvas-header border-bottom"><h2 class="offcanvas-title h5 mb-0">Favoritos</h2><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="listaFavoritosBiblia"></div></div>
<div class="offcanvas offcanvas-end" tabindex="-1" id="painelAnotacoes"><div class="offcanvas-header border-bottom"><h2 class="offcanvas-title h5 mb-0">Anotações</h2><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="listaAnotacoesBiblia"></div></div>

<div class="modal fade" id="modalAnotacaoBiblia" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5">Anotação</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><textarea id="textoAnotacaoBiblia" class="form-control" rows="6" placeholder="Escreva sua observação..."></textarea></div><div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button id="btnSalvarAnotacaoBiblia" class="btn btn-accent">Salvar</button></div></div></div></div>

<script>window.TEOLOGIA_NINJA_PAGINA={pagina:'biblia-leitura.html',ativo:'biblia-leitura',titulo:'Bíblia de Leitura',subtitulo:'Leitura, marcações, anotações e favoritos',secao:'BÍBLIA'};</script>
<script src="js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/tema.js"></script>
<script src="js/sistema.js"></script>
<script src="js/biblia-leitura.js"></script>
<script src="js/pwa.js"></script>
</body></html>
