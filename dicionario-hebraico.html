<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Dicionário Bíblico | Teologia Ninja</title>
  <script>
    (()=>{const t=localStorage.getItem('teologiaNinja_tema')||'dark';const c=localStorage.getItem('teologiaNinja_corDestaque')||'purple';document.documentElement.setAttribute('data-bs-theme',t);document.documentElement.setAttribute('data-accent',c);})();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/dicionario-hebraico.css">
</head>
<body class="app-shell">
  <div id="layoutSistema"></div>
  <main class="app-main dicionario-main">
    <section class="container-fluid py-3 py-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
          <span class="badge text-bg-accent mb-2">Léxico bíblico</span>
          <h1 class="h3 mb-1" id="tituloDicionario">Dicionário Hebraico</h1>
          <p class="text-secondary mb-0" id="subtituloDicionario">Pesquise pelo hebraico, transliteração, português ou Strong.</p>
        </div>
        <button id="btnFavoritos" class="btn btn-outline-accent" type="button">♡ Favoritos <span id="totalFavoritos" class="badge rounded-pill ms-1">0</span></button>
      </div>

      <section class="card dicionario-filtros mb-4">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-12 col-lg-7">
              <div class="input-group input-group-lg">
                <span class="input-group-text">⌕</span>
                <input id="busca" class="form-control" type="search" placeholder="Ex.: אדם, adam, humanidade ou H120" autocomplete="off">
                <button id="limparBusca" class="btn btn-outline-secondary" type="button">×</button>
              </div>
            </div>
            <div class="col-7 col-lg-3">
              <select id="categoria" class="form-select form-select-lg"><option value="">Todas as categorias</option></select>
            </div>
            <div class="col-5 col-lg-2">
              <select id="idioma" class="form-select form-select-lg" title="Escolher idioma">
                <option value="hebraico">Hebraico</option>
                <option value="grego">Grego</option>
              </select>
            </div>
          </div>
          <div id="alfabeto" class="alfabeto-hebraico mt-3"></div>
        </div>
      </section>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div id="resumo" class="text-secondary">Carregando...</div>
        <button id="verTodas" class="btn btn-sm btn-link text-decoration-none d-none" type="button">Ver todas</button>
      </div>
      <div id="mensagem" class="alert d-none"></div>
      <section id="lista" class="row g-3" aria-live="polite"></section>
      <nav class="mt-4"><ul id="paginacao" class="pagination justify-content-center flex-wrap"></ul></nav>
      <footer class="app-footer mt-4">Teologia Ninja © 2026 — Protótipo do Dicionário Bíblico</footer>
    </section>
  </main>

  <div class="offcanvas offcanvas-end detalhe-palavra" tabindex="-1" id="painelPalavra">
    <div class="offcanvas-header border-bottom"><div><small class="text-secondary" id="rotuloPainel">Dicionário Hebraico</small><h2 id="tituloPainel" class="offcanvas-title fs-5">Palavra</h2></div><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body" id="conteudoPalavra"></div>
  </div>

  <script>window.TEOLOGIA_NINJA_PAGINA={pagina:'dicionario-hebraico.html',ativo:'dicionario',titulo:'Dicionário Bíblico',subtitulo:'Hebraico e grego bíblicos',secao:'DICIONÁRIO BÍBLICO'};</script>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/sistema.js"></script>
  <script src="js/dicionario-hebraico.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
